<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Góc Video Cho Bé</title>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: #121212;
        color: white;
    }
    /* Màn hình nhập thông tin */
    #info-screen {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #f4f7f6; display: flex; justify-content: center; align-items: center;
        z-index: 1000; color: #333;
    }
    .info-box { background: white; padding: 30px; border-radius: 12px; width: 350px; text-align: center; }
    .info-box input, .info-box textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    .info-box button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }

    /* Giao diện chính */
    #main-content { display: none; }
    .header-container {
        display: flex; justify-content: space-between; align-items: center;
        padding: 0 20px; height: 50px; background: #1f1f1f;
    }
    #timer { font-weight: bold; color: #ff4d4d; font-size: 18px; }

    /* Khung phát Playlist */
    .player-section {
        height: calc(100vh - 50px);
        width: 100%;
        background: #000;
    }
    iframe { width: 100%; height: 100%; border: none; }

    #settings-btn { position: absolute; bottom: 20px; right: 20px; padding: 8px 12px; cursor: pointer; opacity: 0.6; z-index: 10; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1001; }
    .modal-content { background: white; padding: 20px; border-radius: 8px; text-align: center; width: 300px; color: #333; }
</style>
<script>
    let timeLeft = 300; 
    let timerInterval;

    function updateTimer() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        document.getElementById('timer').innerHTML = `Thời gian còn lại: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        if (timeLeft <= 0) { clearInterval(timerInterval); window.location.href = "about:blank"; } 
        else { timeLeft--; }
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(updateTimer, 1000);
    }

    function confirmInfo() {
        const name = document.getElementById('user-name').value;
        const reason = document.getElementById('user-reason').value;
        const note = document.getElementById('user-note').value;
        if (name.trim() !== "" && reason.trim() !== "" && note.trim() !== "") {
            document.getElementById('info-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            updateTimer();
            startTimer();
        } else { alert("Vui lòng nhập đầy đủ thông tin!"); }
    }

    function openSettings() {
        if (prompt("Nhập mật khẩu:") === "1234") {
            document.getElementById('settings-modal').style.display = 'flex';
        } else { alert("Sai mật khẩu!"); }
    }

    function saveSettings() {
        const newMin = document.getElementById('new-time').value;
        if (newMin && !isNaN(newMin) && parseInt(newMin) > 0) {
            timeLeft = parseInt(newMin) * 60;
            document.getElementById('settings-modal').style.display = 'none';
            updateTimer();
        }
    }
</script>
</head>
<body>
    <div id="info-screen">
        <div class="info-box">
            <h2>Thông Tin Truy Cập</h2>
            <input type="text" id="user-name" placeholder="Bài tập 1">
            <input type="text" id="user-reason" placeholder="Bài tập 2">
            <textarea id="user-note" placeholder="Bài tập 3" rows="3"></textarea>
            <button onclick="confirmInfo()">Xác nhận</button>
        </div>
    </div>

    <div id="main-content">
        <div class="header-container">
            <h2>Danh Sách Video Cho Bé</h2>
            <div id="timer">Thời gian còn lại: 5:00</div>
        </div>

        <div class="player-section">
            <!-- Đã gắn Playlist ID của bạn vào thuộc tính src bên dưới -->
            <iframe 
                src="https://www.youtube-nocookie.com/embed/videoseries?list=PLVSoJ9hA6M6ptd4H6GV9pwzwfjNKdibog" 
                title="YouTube playlist player"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen>
            </iframe>
        </div>

        <button id="settings-btn" onclick="openSettings()">⚙ Cài đặt</button>
    </div>

    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h3>Cài đặt thời gian</h3>
            <input type="number" id="new-time" placeholder="Nhập số phút" min="1">
            <br><br>
            <button onclick="saveSettings()">Lưu</button>
            <button onclick="document.getElementById('settings-modal').style.display='none'">Hủy</button>
        </div>
    </div>
</body>
</html>
